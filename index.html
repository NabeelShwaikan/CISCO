<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0878bd">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="تدريب سيسكو">
  <meta name="description" content="منصة تدريب سيسكو للمعلم والمتدرب ذاتيًا.">
  <title>منصة تدريب سيسكو</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    :root{
      --bg:#f5f8fb;
      --panel:#fff;
      --ink:#0e2235;
      --muted:#627589;
      --border:rgba(14,34,53,.10);
      --brand:#0878bd;
      --cyan:#12a9cb;
      --chip:#edf6fb;
      --shadow:0 14px 34px rgba(20,63,91,.09);
    }
    [data-theme="dark"]{
      --bg:#071522;
      --panel:#0d2030;
      --ink:#edf8ff;
      --muted:#9bb0bf;
      --border:rgba(154,184,204,.18);
      --brand:#39b6f2;
      --cyan:#45d5e9;
      --chip:#102a3c;
      --shadow:0 18px 40px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    html{min-height:100%;scroll-behavior:smooth}
    body{
      min-height:100vh;
      margin:0;
      color:var(--ink);
      background:
        radial-gradient(circle at 8% 6%,rgba(18,169,203,.10),transparent 28%),
        radial-gradient(circle at 92% 0,rgba(8,120,189,.11),transparent 28%),
        var(--bg);
      font-family:"Almarai","Cairo","Segoe UI",Tahoma,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      z-index:-1;
      pointer-events:none;
      opacity:.38;
      background-image:
        linear-gradient(rgba(8,120,189,.045) 1px,transparent 1px),
        linear-gradient(90deg,rgba(8,120,189,.045) 1px,transparent 1px);
      background-size:34px 34px;
      mask-image:linear-gradient(to bottom,#000,transparent 72%);
    }
    a{color:inherit;text-decoration:none}
    button{font:inherit}
    .wrap{width:min(1024px,calc(100% - 40px));margin-inline:auto;padding:26px 0 34px}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--border)}
    .brand{display:flex;align-items:center;gap:12px}
    .brand-mark{
      width:52px;height:52px;display:block;
      background:transparent
    }
    .brand-mark img{width:100%;height:100%;display:block;object-fit:contain}
    .brand-title strong{display:block;font-size:19px;font-weight:900;letter-spacing:-.4px}
    .brand-title span{display:block;margin-top:2px;color:var(--muted);font-size:10px;font-weight:700}
    .theme-btn{
      width:42px;height:42px;border:1px solid var(--border);border-radius:12px;
      display:grid;place-items:center;color:var(--ink);background:var(--panel);
      box-shadow:var(--shadow);cursor:pointer;font-size:19px
    }
    .intro{padding:54px 0 34px;text-align:center}
    .tech-label{display:inline-flex;align-items:center;gap:8px;color:var(--brand);font-size:11px;font-weight:900}
    .tech-label::before,.tech-label::after{content:"";width:24px;height:1px;background:var(--cyan)}
    h1{margin:13px 0 8px;font-size:clamp(29px,5vw,46px);line-height:1.35;letter-spacing:-1.2px}
    .intro p{margin:0;color:var(--muted);font-size:14px;font-weight:600}
    .apps-panel{
      position:relative;overflow:hidden;min-height:255px;padding:24px;
      background:var(--panel);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow)
    }
    .apps-panel::after{
      content:"";position:absolute;width:180px;height:180px;left:-80px;bottom:-110px;
      border:28px solid rgba(8,120,189,.045);border-radius:50%;pointer-events:none
    }
    .panel-head{display:flex;align-items:center;justify-content:space-between;gap:15px;padding-bottom:17px;border-bottom:1px solid var(--border)}
    .panel-head h2{margin:0;font-size:15px;font-weight:900}
    .panel-head span{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:10px;font-weight:800}
    .panel-head span::before{content:"";width:7px;height:7px;border-radius:50%;background:#20b981;box-shadow:0 0 8px rgba(32,185,129,.55)}
    .apps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:25px;padding:26px 10px 12px;align-items:start}
    .app{min-width:0;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--ink)}
    .app-icon{
      width:76px;height:76px;border-radius:23px;display:grid;place-items:center;position:relative;overflow:hidden;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 14px 26px rgba(8,54,82,.18),0 4px 9px rgba(8,54,82,.08);
      transition:transform .16s ease,box-shadow .16s ease
    }
    .app-icon::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 28% 18%,rgba(255,255,255,.62),transparent 30%),linear-gradient(145deg,rgba(255,255,255,.18),transparent 44%)}
    .app-icon svg{position:relative;z-index:1;width:37px;height:37px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 4px 6px rgba(0,0,0,.17))}
    .terms-icon{background:linear-gradient(145deg,#0878bd,#37c0df)}
    .map-icon{background:linear-gradient(145deg,#4338ca,#7d8cf3)}
    .app-name{max-width:110px;font-size:12px;line-height:1.55;font-weight:900}
    .app:hover .app-icon{transform:translateY(-5px) scale(1.045);box-shadow:inset 0 1px 0 rgba(255,255,255,.62),0 19px 34px rgba(8,54,82,.22),0 5px 11px rgba(8,54,82,.10)}
    .app:active .app-icon{transform:translateY(-1px) scale(.98)}
    .app:focus-visible{outline:2px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:7px;border-radius:18px}
    footer{padding-top:25px;text-align:center;color:var(--muted);font-size:10px;font-weight:700}
    @media(max-width:520px){
      .wrap{width:min(100% - 24px,1024px);padding-top:16px}
      header{padding-bottom:15px}.brand-mark{width:46px;height:46px;border-radius:14px}.brand-title strong{font-size:16px}.brand-title span{font-size:9px}
      .intro{padding:38px 0 26px}.intro p{font-size:12px;line-height:1.8}h1{font-size:32px}
      .apps-panel{min-height:225px;padding:17px 12px;border-radius:18px}
      .apps-grid{grid-template-columns:repeat(4,1fr);gap:16px 8px;padding:24px 0 9px}
      .app-icon{width:60px;height:60px;border-radius:19px}.app-icon svg{width:29px;height:29px}.app-name{max-width:74px;font-size:10.5px}
    }
    @media(max-width:350px){.apps-grid{grid-template-columns:repeat(3,1fr)}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="#" aria-label="الصفحة الرئيسية">
        <span class="brand-mark" aria-hidden="true"><img src="icons/logo-transparent.png" alt=""></span>
        <span class="brand-title"><strong>منصة تدريب سيسكو</strong><span>للمعلم والمتدرب ذاتيًا</span></span>
      </a>
      <button class="theme-btn" id="themeButton" type="button" aria-label="تفعيل الوضع الداكن" title="تغيير المظهر">◐</button>
    </header>

    <main>
      <section class="intro" aria-labelledby="pageTitle">
        <span class="tech-label">بيئة تعليمية تقنية</span>
        <h1 id="pageTitle">تعلّم الشبكات بوضوح</h1>
        <p>اختر الأداة التي تحتاجها وابدأ التدريب.</p>
      </section>

      <section class="apps-panel" aria-labelledby="appsTitle">
        <div class="panel-head"><h2 id="appsTitle">التطبيقات المتاحة</h2><span>تطبيقان جاهزان</span></div>
        <div class="apps-grid">
          <a class="app" href="CiscoTerms/index.html">
            <span class="app-icon terms-icon" aria-hidden="true">
              <svg viewBox="0 0 48 48"><path d="M12 7h24a3 3 0 0 1 3 3v28a3 3 0 0 1-3 3H12a3 3 0 0 1-3-3V10a3 3 0 0 1 3-3Z"/><path d="M16 16h16M16 24h11M16 32h14"/></svg>
            </span>
            <span class="app-name">مصطلحات سيسكو</span>
          </a>

          <a class="app" href="CCNAKnowledgeMap/index.html">
            <span class="app-icon map-icon" aria-hidden="true">
              <svg viewBox="0 0 48 48"><circle cx="24" cy="9" r="4"/><circle cx="10" cy="37" r="4"/><circle cx="38" cy="37" r="4"/><circle cx="24" cy="28" r="4"/><path d="m22 13-10 20m14-20 10 20M13 35l7-5m15 5-7-5"/></svg>
            </span>
            <span class="app-name">خريطة معرفة CCNA</span>
          </a>
        </div>
      </section>
    </main>

    <footer>منصة تعليمية مستقلة للتدريب على تقنيات سيسكو</footer>
  </div>

  <script>
    (() => {
      const root = document.documentElement;
      const button = document.getElementById('themeButton');
      button.addEventListener('click', () => {
        const dark = root.dataset.theme !== 'dark';
        root.dataset.theme = dark ? 'dark' : 'light';
        button.textContent = dark ? '☀' : '◐';
        button.setAttribute('aria-label', dark ? 'تفعيل الوضع الفاتح' : 'تفعيل الوضع الداكن');
      });
    })();
  </script>
</body>
</html>
